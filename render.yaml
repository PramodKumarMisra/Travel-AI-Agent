services:
  - type: web
    name: spiti-travel-ai
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MOCK_MODE
        value: "true"
      - key: PYTHON_VERSION
        value: "3.13"
